name: chain_todo
description: "Aplikasi to-do list yang datanya disimpan di smart contract (Sepolia)."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  web3dart: ^3.0.3
  http: ^1.6.0
  flutter_dotenv: ^6.0.2
  wallet: ^0.0.18

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - .env
    - assets/abi/ChainTodo.json